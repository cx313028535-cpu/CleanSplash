name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf app_source
          mkdir -p app_source

          unzip -o CleanSplash-V1.zip -d app_source

          echo "解压后的文件："
          find app_source -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLEW=$(find app_source -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "找不到 Gradle 项目"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "找到 Gradle 项目：$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

          chmod +x "$GRADLEW"

      - name: Fix Gradle version
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          WRAPPER="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "找不到 gradle-wrapper.properties"
            echo "位置：$WRAPPER"
            exit 1
          fi

          echo "Gradle Wrapper 文件：$WRAPPER"

          sed -i 's#gradle-[0-9.]*-all\.zip#gradle-8.9-all.zip#g' "$WRAPPER"
          sed -i 's#gradle-[0-9.]*-bin\.zip#gradle-8.9-bin.zip#g' "$WRAPPER"

          echo "修改后的 Gradle 版本："
          grep "distributionUrl" "$WRAPPER"

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "开始使用 Gradle 8.9 编译 APK..."

          ./gradlew --version

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanSplash-APK
          path: app_source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
