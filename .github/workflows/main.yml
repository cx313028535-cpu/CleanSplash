name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o CleanSplash-V1.zip -d app_source
          find app_source -maxdepth 3 -type f | head -50

      - name: Find Gradle project
        run: |
          if [ -f app_source/gradlew ]; then
            chmod +x app_source/gradlew
          elif [ -f app_source/*/gradlew ]; then
            chmod +x app_source/*/gradlew
          else
            echo "找不到 Gradle 项目"
            exit 1
          fi

      - name: Build APK
        run: |
          cd app_source
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            cd "$(dirname "$(find . -name gradlew -type f | head -1)")"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanSplash-APK
          path: |
            app_source/**/build/outputs/apk/**/*.apk
