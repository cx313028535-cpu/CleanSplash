name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf app_source
          mkdir -p app_source
          unzip -o CleanSplash-V1.zip -d app_source

          echo "===== 解压后的项目文件 ====="
          find app_source -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(find app_source \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 Gradle 项目"
            echo "请检查 ZIP 文件内容"
            exit 1
          fi

          echo "找到 Gradle 项目：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanSplash-APK
          path: app_source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
